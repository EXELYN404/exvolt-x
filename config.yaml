server:
  host: 127.0.0.1
  port: 8080
  auth_token: ''
proxy:
  host: 127.0.0.1
  port: 8081
  allow_remote: true
  autostart: false
  intercept: true
  intercept_only_in_scope: false
  intercept_timeout: 300
  mitm_https: true
  verify_upstream: true
  ignore_hosts: []
  only_in_scope_history: false
  max_body_bytes: 5242880
  upstream_timeout: 30
history:
  max_entries: 50000
network:
  enforce_scope: true
  blocked_hosts: []
  request_timeout: 30
  max_response_bytes: 10485760
intruder:
  max_requests: 10000
  max_concurrency: 20
  max_rps: 50
session:
  autosave: true
  autosave_minutes: 5
scanner:
  passive_enabled: true
